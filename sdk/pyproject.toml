[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-server-sdk"
version = "0.1.0"
description = "Python client for the Model Server API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
