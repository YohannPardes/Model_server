[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-server-inference"
version = "0.1.0"
description = "Single-process model server with dynamic batching"
requires-python = ">=3.11"
# torch is intentionally not listed: the Dockerfile installs it from the
# CPU or CUDA index selected by the TORCH_INDEX_URL build arg.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by FastAPI's TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
